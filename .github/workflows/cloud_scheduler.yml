name: Cloud Scheduler (体育新闻研究知识库)

# 用 GitHub Actions 云端 7x24 运行原本地守护进程的全部定时任务，
# 避免沙箱休眠导致调度中断。DB 通过 Release 资产(db-snapshot)跨运行持久化。
on:
  schedule:
    - cron: "0 0 * * *"      # 每日 08:00 (Beijing)  -> daily
    - cron: "0 12 * * *"     # 每日 20:00 (Beijing)  -> daily
    - cron: "0 19 * * *"     # 每日 03:00 (Beijing)  -> track (增量抓取+构建+部署)
    - cron: "0 1 * * 1"      # 每周一 09:00 (Beijing) -> weekly
    - cron: "10 1 1 * *"     # 每月1日 09:10 (Beijing) -> monthly
    - cron: "0 */6 * * *"    # 每 6 小时 -> backup (持久化 DB)
  workflow_dispatch:
    inputs:
      job:
        description: "手动触发的作业"
        required: true
        default: "dispatch-test"
        type: choice
        options:
          - dispatch-test
          - daily
          - weekly
          - track
          - monthly
          - backup

# 部署步骤需要向仓库推送（git commit + push）
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 让 gh CLI 自动使用 GITHUB_TOKEN（用于 Release 资产拉取/回写）
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # —— 密钥注入（来自 GitHub Secrets，绝不以明文进入仓库）——
      EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
      WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
      WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
      BAIDU_APP_ID: ${{ secrets.BAIDU_APP_ID }}
      BAIDU_SECRET: ${{ secrets.BAIDU_SECRET }}
      BAIDU_FREE_QUOTA: ${{ secrets.BAIDU_FREE_QUOTA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Determine job
        id: job
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 0 * * *"|"0 12 * * *") J=daily ;;
              "0 19 * * *")             J=track ;;
              "0 1 * * 1")              J=weekly ;;
              "10 1 1 * *")             J=monthly ;;
              "0 */6 * * *")            J=backup ;;
              *)                       J=backup ;;
            esac
            echo "job=$J" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cloud_runner
        run: python3 scripts/cloud_runner.py ${{ steps.job.outputs.job }}
