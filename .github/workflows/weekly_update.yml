name: 自动更新知识库

# 触发时机:
#  1. 每周一 06:00 (UTC) 定时运行
#  2. 手动触发（仓库 Actions 页 → Run workflow）
on:
  schedule:
    - cron: '0 6 * * 1'    # 每周一 06:00 UTC (北京时间周一14:00)
  workflow_dispatch: {}     # 允许手动触发

permissions:
  contents: write

jobs:
  update-kb:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install requests

      - name: 自动抓取最新文献
        run: |
          python scripts/auto_fetch.py

      - name: 重建静态站点
        run: |
          python scripts/rebuild_site.py

      - name: 检查是否有更新
        id: check
        run: |
          if git diff --quiet data.json index.html ; then
            echo "无更新，跳过提交"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "有更新，准备提交"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 提交并推送更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git commit -m "🤖 自动更新知识库 $(date '+%Y-%m-%d %H:%M')"
          git push

      - name: 触发 Pages 重新部署
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "站点已更新，GitHub Pages 将自动重新部署"
